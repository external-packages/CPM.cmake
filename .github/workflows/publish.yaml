name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Publish CPM.cmake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set CPM version by tag
        run: |
          mkdir dist
          sed -e "s/1.0.0-development-version/${GITHUB_REF/refs\/tags\/v}/g" cmake/CPM.cmake > dist/CPM.cmake
          sed -e "s/1.0.0-development-version/${GITHUB_REF/refs\/tags\/v}/g" \
              -e "s/CPM_HASH_SUM_PLACEHOLDER/$(sha256sum dist/CPM.cmake | cut -d' ' -f1)/" cmake/get_cpm.cmake > dist/get_cpm.cmake

      - name: Tarball url
        run: echo "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
      
      - name: Create tarball sha256 
        run: echo TAR_GZ_SHA256SUM=$(curl -sL "${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | shasum -a 256 | cut -d " " -f 1) >> $GITHUB_ENV
      
      - name: Upload CPM.cmake to release
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: dist/*.cmake
          file_glob: true
          overwrite: true
          body: ${{ env.TAR_GZ_SHA256SUM }}
